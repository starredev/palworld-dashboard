server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # VitePress uses clean URLs (/installation/docker -> installation/docker.html).
  # Try the path, then the .html file, then a directory index; else a real 404.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Long-cache fingerprinted assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Serve VitePress's own styled 404 page.
  error_page 404 /404.html;
}
