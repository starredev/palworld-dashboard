# Optional overlay: serve the documentation site (docs/) as its own container.
#
#   docker compose -f compose.yml -f compose.docs.yml up -d --build
#
# Point a subdomain (e.g. pal.docs.starre.dev) at ${DOCS_PORT:-8081} with your
# reverse proxy. See docs → Installation → Deploy with Docker.
name: tsuki-panel

services:
  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    ports:
      - '${DOCS_PORT:-8081}:80'
    restart: unless-stopped
