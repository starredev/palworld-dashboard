name: tsuki-panel

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      # Timezone for scheduled restarts & config events (their times are local to
      # this container). Defaults to UTC — set TZ in your .env, e.g. Europe/Amsterdam.
      TZ: ${TZ:-UTC}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD in your .env}
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET (min 16 chars) in your .env}
      SESSION_TTL: ${SESSION_TTL:-7d}
      # Auto-backup every N hours (0 = off), keeping the newest N.
      BACKUP_SCHEDULE_HOURS: ${BACKUP_SCHEDULE_HOURS:-0}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      # The reverse proxy makes everything same-origin, so browser CORS is unused.
      # Mark cookies Secure only when serving over HTTPS (see COOKIE_SECURE below).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Optional Discord OAuth login (all three enable it). See .env.example.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_ALLOWED_IDS: ${DISCORD_ALLOWED_IDS:-}
      DISCORD_ADMIN_IDS: ${DISCORD_ADMIN_IDS:-}
      # Palworld connection (set whichever your server exposes; both optional).
      PALWORLD_REST_URL: ${PALWORLD_REST_URL:-}
      PALWORLD_REST_USERNAME: ${PALWORLD_REST_USERNAME:-admin}
      PALWORLD_REST_PASSWORD: ${PALWORLD_REST_PASSWORD:-}
      PALWORLD_RCON_HOST: ${PALWORLD_RCON_HOST:-}
      PALWORLD_RCON_PORT: ${PALWORLD_RCON_PORT:-25575}
      PALWORLD_RCON_PASSWORD: ${PALWORLD_RCON_PASSWORD:-}
      # Absolute URL of the live-map, served to the browser at runtime.
      LIVEMAP_URL: ${LIVEMAP_URL:-}
      # Optional full Palworld map image for the built-in map background.
      MAP_IMAGE_URL: ${MAP_IMAGE_URL:-}
      # Guilds & Pals via the live-map's GameData API (internal URL + paths).
      GAMEDATA_URL: ${GAMEDATA_URL:-}
      GAMEDATA_STATE_PATH: ${GAMEDATA_STATE_PATH:-/api/state}
      GAMEDATA_OBJECTS_PATH: ${GAMEDATA_OBJECTS_PATH:-/api/objects}
    volumes:
      # Persist save backups created from the Backups page.
      - tsuki-backups:/backups
    expose:
      - '4000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        # Same-origin — nginx proxies /api to the api service. Leave as-is.
        VITE_API_URL: /api
    ports:
      # The ONLY public entrypoint. Put a TLS proxy in front for HTTPS.
      - '${HTTP_PORT:-80}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tsuki-backups:
