# Overlay: connect the Tsuki API to an existing Palworld server stack's network
# so it can reach the (unpublished) REST API at http://<palworld-service>:8212.
#
# Usage:
#   1. Find the Palworld stack's docker network:  docker network ls
#   2. In .env set PALWORLD_NETWORK to that name (e.g. palworld_default),
#      plus PALWORLD_REST_URL + PALWORLD_REST_PASSWORD.
#   3. docker compose -f compose.yml -f compose.palworld.yml up -d --build

services:
  api:
    networks:
      - default
      - palworld
    # Optional: mount the Palworld data dir to edit PalWorldSettings.ini live.
    # Set PALWORLD_DATA_DIR in .env to the host path of the game server's data
    # (the dir the palworld container mounts, e.g. /home/palworld/.../palworld).
    #
    # The Docker socket lets the api (a) read the game container's `docker logs`
    # for the Logs page, and (b) stop/start it for the save editor — a save edit
    # must take the server down, rewrite the .sav, and bring it back up. Both
    # need PALWORLD_CONTAINER set in .env. Mounted read-WRITE for the stop/start;
    # remove this line (and the save editor is simply hidden) if you'd rather not
    # grant socket access. NOTE: Docker socket access ~= host root — only enable
    # on a server you control.
    volumes:
      - ${PALWORLD_DATA_DIR:-./palworld-data}:/palworld-data
      - /var/run/docker.sock:/var/run/docker.sock:rw
    # The api runs as non-root, so add the host's `docker` group gid to let it
    # read the socket. Find it with:  getent group docker  → set DOCKER_GID.
    group_add:
      - '${DOCKER_GID:-999}'

networks:
  palworld:
    external: true
    name: ${PALWORLD_NETWORK:-palworld_default}
